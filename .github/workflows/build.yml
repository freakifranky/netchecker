name: Build NetChecker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          ls /Applications | grep Xcode
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build NetChecker.app (unsigned, for local testing)
        run: |
          xcodebuild \
            -project NetChecker.xcodeproj \
            -target NetChecker \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Ad-hoc codesign so it can launch
        run: |
          codesign --force --deep --sign - "build/NetChecker.app"

      - name: Zip app for download
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent NetChecker.app NetChecker.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetChecker-app
          path: build/NetChecker.zip
          retention-days: 14
